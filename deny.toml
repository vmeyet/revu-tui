[graph]
all-features = true

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode via mrk's syntect only decodes the syntax dumps embedded in the binary, never input" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via mrk's fontdb and Mermaid renderer only parses installed system fonts; no maintained drop-in yet" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/vmeyet/mrk-cli"]
