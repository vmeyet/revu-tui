[package]
name = "revu"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Review GitLab merge requests and GitHub pull requests from your terminal: a TUI plus scriptable commands."
license = "MIT"
repository = "https://github.com/vmeyet/revu-tui"
readme = "README.md"

[[bin]]
name = "revu"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0"
futures-util = "0.3"
glob = "0.3"
libc = "0.2"
owo-colors = "4"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sha1_smol = "1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
shell-words = "1.1"
similar = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "sync", "io-util"] }
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
url = "2.5"

[dev-dependencies]
insta = "1"
proptest = { version = "1.11", default-features = false, features = ["std"] }
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
format_collect = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
